version: '3.8'

services:
  # ==================== Main Application ====================
  lihc-platform:
    build:
      context: .
      dockerfile: Dockerfile
    image: lihc-platform:latest
    container_name: lihc-platform
    ports:
      - "${PORT:-8050}:8050"
    volumes:
      - ./src:/app/src:ro
      - ./data:/app/data
      - ./results:/app/results
      - ./logs:/app/logs
      - ./config:/app/config:ro
    environment:
      - APP_ENV=${APP_ENV:-production}
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-here}
      - DATABASE_URL=postgresql://${DB_USER:-lihc_user}:${DB_PASSWORD:-password}@postgres:5432/${DB_NAME:-lihc_db}
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    networks:
      - lihc-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8050/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    command: python main.py --dashboard --port 8050

  # ==================== PostgreSQL Database ====================
  postgres:
    image: postgres:14-alpine
    container_name: lihc-postgres
    environment:
      - POSTGRES_USER=${DB_USER:-lihc_user}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-password}
      - POSTGRES_DB=${DB_NAME:-lihc_db}
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${DB_PORT:-5432}:5432"
    networks:
      - lihc-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-lihc_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== Redis Cache ====================
  redis:
    image: redis:7-alpine
    container_name: lihc-redis
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - lihc-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== Nginx Reverse Proxy (Production) ====================
  nginx:
    image: nginx:alpine
    container_name: lihc-nginx
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/ssl:/etc/nginx/ssl:ro
      - ./static:/usr/share/nginx/html/static:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - lihc-platform
    networks:
      - lihc-network
    restart: unless-stopped
    profiles:
      - production

  # ==================== Celery Worker (Async Tasks) ====================
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: lihc-platform:latest
    container_name: lihc-celery-worker
    command: celery -A src.tasks worker --loglevel=info --concurrency=4
    volumes:
      - ./data:/app/data
      - ./results:/app/results
      - ./logs:/app/logs
    environment:
      - APP_ENV=${APP_ENV:-production}
      - DATABASE_URL=postgresql://${DB_USER:-lihc_user}:${DB_PASSWORD:-password}@postgres:5432/${DB_NAME:-lihc_db}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    depends_on:
      - postgres
      - redis
    networks:
      - lihc-network
    restart: unless-stopped
    profiles:
      - full

  # ==================== Celery Beat (Scheduled Tasks) ====================
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    image: lihc-platform:latest
    container_name: lihc-celery-beat
    command: celery -A src.tasks beat --loglevel=info
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - APP_ENV=${APP_ENV:-production}
      - DATABASE_URL=postgresql://${DB_USER:-lihc_user}:${DB_PASSWORD:-password}@postgres:5432/${DB_NAME:-lihc_db}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
    depends_on:
      - postgres
      - redis
    networks:
      - lihc-network
    restart: unless-stopped
    profiles:
      - full

  # ==================== Flower (Celery Monitoring) ====================
  flower:
    image: mher/flower:latest
    container_name: lihc-flower
    command: celery flower --broker=redis://redis:6379/1 --port=5555
    ports:
      - "${FLOWER_PORT:-5555}:5555"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/1
      - FLOWER_BASIC_AUTH=${FLOWER_USER:-admin}:${FLOWER_PASSWORD:-admin}
    depends_on:
      - redis
    networks:
      - lihc-network
    restart: unless-stopped
    profiles:
      - monitoring

  # ==================== Prometheus (Metrics) ====================
  prometheus:
    image: prom/prometheus:latest
    container_name: lihc-prometheus
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - lihc-network
    restart: unless-stopped
    profiles:
      - monitoring

  # ==================== Grafana (Dashboards) ====================
  grafana:
    image: grafana/grafana:latest
    container_name: lihc-grafana
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./docker/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=redis-datasource
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
    networks:
      - lihc-network
    restart: unless-stopped
    profiles:
      - monitoring

  # ==================== Backup Service ====================
  backup:
    image: postgres:14-alpine
    container_name: lihc-backup
    volumes:
      - ./backups:/backups
      - postgres-data:/var/lib/postgresql/data:ro
    environment:
      - POSTGRES_USER=${DB_USER:-lihc_user}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-password}
      - POSTGRES_DB=${DB_NAME:-lihc_db}
    command: >
      sh -c "while true; do
        PGPASSWORD=$$POSTGRES_PASSWORD pg_dump -h postgres -U $$POSTGRES_USER $$POSTGRES_DB > /backups/backup_$$(date +%Y%m%d_%H%M%S).sql;
        find /backups -name 'backup_*.sql' -mtime +7 -delete;
        sleep 86400;
      done"
    depends_on:
      - postgres
    networks:
      - lihc-network
    restart: unless-stopped
    profiles:
      - backup

# ==================== Networks ====================
networks:
  lihc-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# ==================== Volumes ====================
volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local